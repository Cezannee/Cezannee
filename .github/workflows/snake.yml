
name: Generate Endfield Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Endfield Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Cezannee
          outputs: |
            dist/github-snake.svg?color_snake=%23FFFA00&color_dots=%2320221F,%2355594A,%2392977A,%23C6CB9C,%23FFFA00
            dist/github-snake-dark.svg?color_snake=%23FFFA00&color_dots=%2320221F,%2355594A,%2392977A,%23C6CB9C,%23FFFA00

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
